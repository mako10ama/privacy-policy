<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>メールアドレスの確認｜まちのお地蔵さん</title>
<style>
  :root {
    --bg: #f7f4ec;
    --card: #ffffff;
    --text: #2f3a2f;
    --sub: #5f6b5f;
    --green: #5f8266;
    --green-dark: #4b6a52;
    --line: #dfe5da;
    --error-bg: #fbeeee;
    --error-text: #8a2f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c211c;
      --card: #262d26;
      --text: #e8ede6;
      --sub: #b3bdb1;
      --green: #7fa587;
      --green-dark: #93b79b;
      --line: #3a443a;
      --error-bg: #3a2424;
      --error-text: #f0b4b4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--green-dark); }
  .lead { margin: 0 0 24px; color: var(--sub); font-size: 14px; }
  p { margin: 0 0 16px; }
  .note { font-size: 13px; color: var(--sub); margin: 20px 0 0; }
  button {
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .message { border-radius: 12px; padding: 12px 14px; font-size: 14px; text-align: left; margin: 16px 0 0; }
  .message.error { background: var(--error-bg); color: var(--error-text); }
  .done-mark { font-size: 40px; margin: 0 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>まちのお地蔵さん</h1>
  <p class="lead">メールアドレスの確認</p>

  <!-- 1. 確認を押してもらう画面（ボタンを押すまで、確認は済まない） -->
  <section id="ask">
    <p>ご自身で登録した場合は、<br>下のボタンを押してください。</p>
    <button id="confirm" type="button">はい、私です</button>
    <div id="ask-message" class="message error" role="alert" hidden></div>
    <p class="note">心当たりがない場合は、このページを閉じてください。<br>何も起こりません。</p>
  </section>

  <!-- 2. 確認できた画面 -->
  <section id="done" hidden>
    <p class="done-mark" aria-hidden="true">🙏</p>
    <p><strong>確認できました。</strong></p>
    <p>アプリに戻って、<br>登録したメールアドレスとパスワードで<br>ログインしてください。</p>
  </section>

  <!-- 3. 確認できなかった画面 -->
  <section id="failed" hidden>
    <div id="failed-message" class="message error" role="alert"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ▼ Supabase の「Project Settings → API」にある値を入れる（anon key は公開してよいキー）
  //   service_role のキーは、絶対にここに入れない
  var SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
  var SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

  // この画面で扱う確認の種類（新規登録の確認だけ）
  var ALLOWED_TYPES = ["email", "signup"];

  var MESSAGES = {
    missing: "確認のリンクが正しくありません。メールのボタンから、もう一度開いてください。",
    expired: "このリンクは、期限が切れているか、すでに使われています。確認がすでに済んでいる場合は、アプリでそのままログインできます。ログインできない場合は、アプリで確認メールを再送してください。",
    network: "通信できませんでした。電波のよい場所で、もう一度押してください。",
    other: "確認できませんでした。しばらくしてから、もう一度お試しください。"
  };

  var params = new URLSearchParams(window.location.search);
  var tokenHash = params.get("token_hash");
  var type = params.get("type") || "email";

  // トークンを、アドレス欄や履歴に残さない
  if (window.history && typeof window.history.replaceState === "function") {
    window.history.replaceState(null, "", window.location.pathname);
  }

  var askSection = document.getElementById("ask");
  var doneSection = document.getElementById("done");
  var failedSection = document.getElementById("failed");
  var failedMessage = document.getElementById("failed-message");
  var askMessage = document.getElementById("ask-message");
  var button = document.getElementById("confirm");
  var busy = false;

  function showFailed(text) {
    failedMessage.textContent = text;
    askSection.hidden = true;
    doneSection.hidden = true;
    failedSection.hidden = false;
  }

  function showDone() {
    askSection.hidden = true;
    failedSection.hidden = true;
    doneSection.hidden = false;
  }

  function showRetry(text) {
    askMessage.textContent = text;
    askMessage.hidden = false;
    button.disabled = false;
    button.textContent = "はい、私です";
    busy = false;
  }

  // リンクが正しくないときは、ボタンを出さずに、案内だけを出す
  if (!tokenHash || ALLOWED_TYPES.indexOf(type) === -1) {
    showFailed(MESSAGES.missing);
    return;
  }

  button.addEventListener("click", function () {
    if (busy) { return; }
    busy = true;
    button.disabled = true;
    button.textContent = "確認しています…";
    askMessage.hidden = true;

    fetch(SUPABASE_URL + "/auth/v1/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ type: type, token_hash: tokenHash })
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          return { ok: res.ok, status: res.status, body: body };
        });
      })
      .then(function (r) {
        if (r.ok) {
          showDone();
          return;
        }
        var code = (r.body && (r.body.error_code || r.body.code)) || "";
        if (code === "otp_expired" || r.status === 403 || r.status === 404 || r.status === 410) {
          showFailed(MESSAGES.expired);
        } else if (r.status >= 500) {
          showRetry(MESSAGES.other);
        } else {
          showFailed(MESSAGES.other);
        }
      })
      .catch(function () {
        showRetry(MESSAGES.network);
      });
  });
})();
</script>
</body>
</html>
